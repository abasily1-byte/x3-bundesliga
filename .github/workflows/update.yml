name: Update Bundesliga dashboard

on:
  workflow_dispatch:
  schedule:
    # Same staggered, off-peak schedule as the Premier League sister project.
    # Two opportunities each hour reduce the impact of delayed/dropped events.
    - cron: "7,37 * * * *"
  push:
    branches: [main]
    paths:
      - generate_bundesliga_bmp.py
      - requirements.txt
      - test_generator.py
      - .github/workflows/update.yml

permissions:
  contents: write

concurrency:
  group: bundesliga-dashboard-${{ github.ref }}
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: python -m pip install --requirement requirements.txt
      - name: Test parsing and layout edge cases
        run: python -m unittest -v
      - name: Generate and validate dashboard
        run: python generate_bundesliga_bmp.py --validate
      - name: Commit changed dashboard
        shell: bash
        run: |
          git add Bundesliga.bmp Bundesliga_preview.png
          if git diff --cached --quiet; then
            echo "Dashboard artifacts are unchanged."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Update Bundesliga dashboard [skip ci]"
          git pull --rebase origin "${GITHUB_REF_NAME}"
          git push origin "HEAD:${GITHUB_REF_NAME}"
